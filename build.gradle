plugins {
    id 'java'
    id 'groovy'
}

group = 'com.zg.acelera'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.4')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JUnit que já estava no projeto
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spock + Groovy
    testImplementation platform('org.spockframework:spock-bom:2.4-M6-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy:4.0.26'
}

test {
    useJUnitPlatform()
}

tasks.register('executarApiNotificacoesEmail', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.com.zg.todolist.backend.email.InicializadorApiEmail'
}