plugins {
    id 'java'
    id 'groovy'
}

group = 'com.zg.acelera'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.4')
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // JUnit que já estava no projeto
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Spock + Groovy
    testImplementation platform('org.spockframework:spock-bom:2.4-M6-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.apache.groovy:groovy:4.0.26'
}

test {
    useJUnitPlatform()
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

tasks.register('executarApiNotificacoesTelegram', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.com.zg.todolist.backend.telegram.InicializadorApiTelegram'

    if (localPropertiesFile.exists()) {
        environment 'TELEGRAM_BOT_TOKEN', localProperties.getProperty('TELEGRAM_BOT_TOKEN')
        environment 'TELEGRAM_CHAT_ID', localProperties.getProperty('TELEGRAM_CHAT_ID')

    }
}

// API DE EMAIL
tasks.register('executarApiNotificacoesEmail', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'br.com.zg.todolist.backend.email.InicializadorApiEmail'

    if (localPropertiesFile.exists()) {
        environment([
                'TODO_EMAIL_API_TOKEN': localProperties.getProperty('TODO_EMAIL_API_TOKEN'),
                'RESEND_API_KEY': localProperties.getProperty('RESEND_API_KEY'),
                'TODO_EMAIL_FROM': localProperties.getProperty('TODO_EMAIL_FROM'),
                'TODO_EMAIL_TO': localProperties.getProperty('TODO_EMAIL_TO')
        ])
    }

    environment('TODO_EMAIL_ALLOWED_ORIGIN', '*')
}
