<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TODO List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">
    <div>
        <h1>TODO List</h1>
        <p>Organize suas tarefas</p>
    </div>
</header>

<div class="layout">

    <aside class="menu">

        <h2>Menu</h2>

        <nav>
            <button class="menu-item ativo" data-secao="cadastrar">
                Cadastrar tarefa
            </button>

            <button class="menu-item" data-secao="tarefas">
                Minhas tarefas
            </button>

            <button class="menu-item" data-secao="filtros">
                Filtros
            </button>
        </nav>

    </aside>

    <main class="conteudo">

        <!-- CADASTRO -->
        <section id="cadastrar" class="secao ativa">

            <h2>Nova Tarefa</h2>

            <form id="formTarefa">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" required></textarea>
                </div>

                <div class="campo">
                    <label for="dataTermino">Data de término</label>
                    <input type="date" id="dataTermino" required>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required>
                </div>

                <div class="campo">
                    <label for="alarme">Alarme (minutos)</label>
                    <input type="number" id="alarme" min="1">
                    <small>Deixe vazio caso não queira configurar.</small>
                </div>

                <button type="submit" class="btn-principal" id="botaoFormulario">
                    Adicionar tarefa
                </button>

                <button type="button" id="botaoCancelarEdicao" hidden>
                    Cancelar edição
                </button>

            </form>

        </section>


        <!-- LISTAGEM -->
        <section id="tarefas" class="secao">

            <h2>Minhas Tarefas</h2>

            <div id="listaTarefas"></div>

        </section>


        <section id="filtros" class="secao">

            <h2>Filtrar tarefas</h2>

            <div class="campo">
                <label for="filtroCategoria">Categoria</label>
                <input type="text" id="filtroCategoria" placeholder="Digite uma categoria">
            </div>

            <div class="campo">
                <label for="filtroPrioridade">Prioridade</label>
                <select id="filtroPrioridade">
                    <option value="">Todas</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="campo">
                <label for="filtroStatus">Status</label>
                <select id="filtroStatus">
                    <option value="">Todos</option>
                    <option value="TODO">TODO</option>
                    <option value="DOING">DOING</option>
                    <option value="DONE">DONE</option>
                </select>
            </div>

            <button type="button" id="botaoFiltrar">
                Aplicar filtros
            </button>

            <button type="button" id="botaoLimparFiltros">
                Limpar filtros
            </button>

            <div id="resultadoFiltros"></div>

        </section>

    </main>

</div>

<script src="js/script.js"></script>

</body>
</html>
