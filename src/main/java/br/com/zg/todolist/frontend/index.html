<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo TODO List para organização de tarefas diárias">

    <title>TODO List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topo">
    <div>
        <h1>TODO List</h1>
        <p>Organize suas tarefas</p>
    </div>
</header>

<div id="mensagem" class="mensagem" aria-live="polite"></div>

<div class="layout">

    <!-- MENU LATERAL -->
    <aside class="menu">
        <h2>Menu</h2>
        <nav>
            <button type="button" class="menu-item ativo" data-secao="cadastrar">
                Cadastrar tarefa
            </button>
            <button type="button" class="menu-item" data-secao="tarefas">
                Minhas tarefas
            </button>
            <button type="button" class="menu-item" data-secao="filtros">
                Filtros
            </button>
        </nav>

        <button type="button" class="botao-contraste" id="botaoContraste" aria-pressed="false">
            Alto contraste
        </button>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <!-- SEÇÃO: CADASTRO -->
        <section id="cadastrar" class="secao ativa">
            <h2>Nova Tarefa</h2>

            <form id="formTarefa">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" required></textarea>
                </div>

                <div class="campo">
                    <label for="dataTermino">Data de término</label>
                    <input type="date" id="dataTermino" required>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade" required>
                        <option value="">Selecione</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="TODO">TODO</option>
                        <option value="DOING">DOING</option>
                        <option value="DONE">DONE</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <input type="text" id="categoria" required>
                </div>

                <div class="campo">
                    <label for="alarme">Horário do alarme</label>
                    <input type="time" id="alarme">
                    <small>Deixe vazio caso não queira configurar.</small>
                </div>

                <div class="acoes-formulario">
                    <button type="submit" class="btn-principal" id="botaoFormulario">
                        Adicionar tarefa
                    </button>
                    <button type="button" id="botaoCancelarEdicao" hidden>
                        Cancelar edição
                    </button>
                </div>
            </form>
        </section>

        <!-- SEÇÃO: LISTAGEM -->
        <section id="tarefas" class="secao">
            <h2>Minhas Tarefas</h2>

            <div id="listaTarefas"></div>

            <div class="acoes-multiplas">
                <label class="checkbox-inline">
                    <input type="checkbox" id="selecionarTodas">
                    Selecionar todas
                </label>

                <label for="statusMultiplo">Novo status:</label>
                <select id="statusMultiplo">
                    <option value="">Selecione</option>
                    <option value="TODO">TODO</option>
                    <option value="DOING">DOING</option>
                    <option value="DONE">DONE</option>
                </select>

                <button type="button" id="botaoStatusMultiplo">
                    Alterar selecionadas
                </button>
            </div>
        </section>

        <!-- SEÇÃO: FILTROS -->
        <section id="filtros" class="secao">
            <h2>Filtrar tarefas</h2>

            <div class="filtro">
                <label class="checkbox-inline" for="ativarCategoria">
                    <input type="checkbox" id="ativarCategoria">
                    Ativar
                </label>
                <label for="filtroCategoria">Categoria</label>
                <input type="text" id="filtroCategoria" placeholder="Digite uma categoria" disabled>
            </div>

            <div class="filtro">
                <label class="checkbox-inline" for="ativarPrioridade">
                    <input type="checkbox" id="ativarPrioridade">
                    Ativar
                </label>
                <label for="filtroPrioridade">Prioridade</label>
                <select id="filtroPrioridade" disabled>
                    <option value="">Selecione</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <div class="filtro">
                <label class="checkbox-inline" for="ativarStatus">
                    <input type="checkbox" id="ativarStatus">
                    Ativar
                </label>
                <label for="filtroStatus">Status</label>
                <select id="filtroStatus" disabled>
                    <option value="">Selecione</option>
                    <option value="TODO">TODO</option>
                    <option value="DOING">DOING</option>
                    <option value="DONE">DONE</option>
                </select>
            </div>

            <div class="acoes-filtros">
                <button type="button" id="botaoFiltrar" class="btn-principal">
                    Aplicar filtros
                </button>
                <button type="button" id="botaoLimparFiltros">
                    Limpar filtros
                </button>
            </div>

            <div id="resultadoFiltros" aria-live="polite"></div>
        </section>

    </main>
</div>

<footer class="rodape">
    <p>Criado por Sóstenes Maciel para a trilha de Javascript</p>
    <p>&copy; 2026 - Acelera ZG. Todos os direitos reservados.</p>
</footer>

<script type="module" src="js/app.js"></script>

</body>
</html>
